description: Offline demo using a local Python provider
providers:
  - id: file://./demo_provider.py
    label: local-python-provider
    config:
      positive_words:
        - love
        - great
        - helpful
      negative_words:
        - terrible
        - frustrating
        - broken
prompts:
  - "Classify the sentiment of this text and return JSON only: {{text}}"
tests:
  - description: Positive text should be classified as positive
    vars:
      text: "I love using promptfoo for evals"
    assert:
      - type: contains
        value: '"sentiment": "positive"'
      - type: contains
        value: '"contains_promptfoo": true'

  - description: Negative text should be classified as negative
    vars:
      text: "This workflow is terrible and frustrating"
    assert:
      - type: contains
        value: '"sentiment": "negative"'