description: Run s01 through promptfoo using a Python provider wrapper
providers:
  - id: file://./s01_provider.py
    label: s01-judge-provider
prompts:
  - "Judge the two answers for this question: {{question}}"
tests:
  - description: Snail well reasoning case
    vars:
      question: "蜗牛在20米深的井底，白天往上爬5米，晚上向下滑4米。请问它几天能爬出井口？"
      answer_a: "蜗牛每天净向上爬 5 - 4 = 1 米。井深 20 米，所以需要 20 / 1 = 20 天。答案是20天。"
      answer_b: "前15天，蜗牛每天净爬1米，第15天结束时爬了15米。第16天白天，蜗牛向上爬5米，15 + 5 = 20米，直接爬出井口，不会再向下滑。答案是16天。"
    assert:
      - type: is-json
      - type: contains
        value: '"winner"'
      - type: contains
        value: '"reason"'

  - description: Siblings logic case
    vars:
      question: "大卫有三个姐妹，每个姐妹都有一个兄弟。请问大卫有几个兄弟？"
      answer_a: "大卫有三个姐妹，每个姐妹有一个兄弟，所以是 3 * 1 = 3 个兄弟。大卫有3个兄弟。"
      answer_b: "大卫的三个姐妹的那个“一个兄弟”，其实就是大卫本人。因此大卫没有其他的兄弟。答案是0个（大卫是唯一的男孩）。"
    assert:
      - type: is-json
      - type: contains
        value: '"winner"'
      - type: contains
        value: '"reason"'