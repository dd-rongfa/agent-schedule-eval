description: Run s02 through promptfoo using a Python provider wrapper
providers:
  - id: file://./s02_provider.py
    label: s02-blind-judge-provider
prompts:
  - "Solve the following question: {{question}}"
tests:
  - description: Strawberry counting trap
    vars:
      question: "单词 'strawberrry' 里面共有几个字母 'r'？"
    assert:
      - type: is-json
      - type: contains
        value: '"final_winner"'
      - type: contains
        value: '"judge_1"'

  - description: Table corner boundary-condition trap
    vars:
      question: "一个标准的正方形长方形桌子被锯掉了一个角，现在桌子还剩下几个角？请列出所有可能性。"
    assert:
      - type: is-json
      - type: contains
        value: '"final_winner"'
      - type: contains
        value: '"judge_2"'