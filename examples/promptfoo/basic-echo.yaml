description: Basic offline demo using the built-in echo provider
providers:
  - echo
prompts:
  - "Answer in one short line: {{question}}"
tests:
  - description: Variable substitution works
    vars:
      question: "2 + 2 = 4"
    assert:
      - type: contains
        value: "2 + 2 = 4"

  - description: Prompt template preserves the user request
    vars:
      question: "Translate hello to Chinese"
    assert:
      - type: contains
        value: "Translate hello to Chinese"

  - description: Assertions can enforce formatting expectations
    vars:
      question: "Return JSON with a field named answer"
    assert:
      - type: contains
        value: "JSON"