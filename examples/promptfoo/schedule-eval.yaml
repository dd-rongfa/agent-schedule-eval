# ============================================================
# Agent 定时任务意图评测 — promptfoo 版（Bloom L1-L3 示例）
# ============================================================
#
# 本文件演示如何用 promptfoo 框架评测 Agent 的定时任务意图理解。
# 核心评测使用 pytest（agent_schedule_eval/），原因：
#   1. Function Calling 断言需要解析 tool_calls 结构，promptfoo 的 assert 不够灵活
#   2. 需要 mock 工具 + 多轮交互，pytest fixture 更适合
#   3. 结果需要按 Bloom 层级聚合分析，pytest 的参数化更方便
#
# 但 promptfoo 适合快速验证 prompt 变更的影响——改 prompt 后一行命令看结果。
# 两个框架各有分工，不是替代关系。
# ============================================================

description: "Agent 定时任务意图评测 — Bloom L1-L3 快速验证"

providers:
  - id: "file://./schedule_provider.py"
    label: schedule-intent-eval

prompts:
  - "{{input}}"

tests:
  # ── L1 Remember：识别意图类型 ──
  - description: "L1 — 识别简单定时创建意图"
    vars:
      input: "5分钟后提醒我喝水"
    assert:
      - type: contains
        value: "create_schedule"

  - description: "L1 — 识别取消意图"
    vars:
      input: "取消那个提醒"
    assert:
      - type: contains
        value: "cancel_schedule"

  - description: "L1 — 识别周期性任务意图"
    vars:
      input: "每天早上叫我起床"
    assert:
      - type: contains
        value: "create_recurring"

  # ── L2 Understand：理解模糊时间 ──
  - description: "L2 — 理解口语化时间「明天早上」"
    vars:
      input: "明天早上8点提醒我开会"
    assert:
      - type: contains
        value: "create_schedule"
      - type: icontains
        value: "8"

  - description: "L2 — 理解「后天中午」"
    vars:
      input: "后天中午提醒我取快递"
    assert:
      - type: contains
        value: "create_schedule"

  - description: "L2 — 理解「下班后」模糊时段"
    vars:
      input: "下班后提醒我去超市"
    assert:
      - type: contains
        value: "create_schedule"
      - type: not-contains
        value: "clarify"

  # ── L3 Apply：结构化参数输出 ──
  - description: "L3 — 解析「每周一三五早上7点」"
    vars:
      input: "每周一三五早上7点提醒我跑步"
    assert:
      - type: contains
        value: "create_recurring"
      - type: icontains
        value: "7"

  - description: "L3 — 解析相对时间「半小时后」"
    vars:
      input: "半小时后提醒我吃药"
    assert:
      - type: contains
        value: "create_schedule"
      - type: icontains
        value: "30"
