description: Evaluate pre-generated outputs with echo and a transform
providers:
  - echo
prompts:
  - "{{logged_output}}"
defaultTest:
  options:
    transform: "JSON.parse(output).response"
tests:
  - description: Production log says Paris is the capital of France
    vars:
      logged_output: '{"response":"Paris is the capital of France.","confidence":0.95,"model":"demo-model"}'
    assert:
      - type: contains
        value: "Paris"
      - type: contains
        value: "France"

  - description: Another logged answer mentions London
    vars:
      logged_output: '{"response":"London is in England.","confidence":0.98,"model":"demo-model"}'
    assert:
      - type: contains
        value: "London"