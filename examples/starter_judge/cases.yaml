- description: Arithmetic trap example
  vars:
    question: 蜗牛在20米深的井底，白天往上爬5米，晚上向下滑4米。请问它几天能爬出井口？
    answer_a: 蜗牛每天净向上爬1米，所以需要20天才能爬出井口。
    answer_b: 前15天结束后蜗牛到15米，第16天白天再爬5米正好出井，所以答案是16天。
  assert:
    - type: is-json
    - type: contains
      value: '"winner"'
    - type: contains
      value: '"reason"'

- description: Sibling logic example
  vars:
    question: 大卫有三个姐妹，每个姐妹都有一个兄弟。请问大卫有几个兄弟？
    answer_a: 每个姐妹都有一个兄弟，所以大卫有3个兄弟。
    answer_b: 三个姐妹说的那个兄弟其实都是大卫本人，所以大卫没有其他兄弟。
  assert:
    - type: is-json
    - type: contains
      value: '"winner"'
    - type: contains
      value: '"reason"'