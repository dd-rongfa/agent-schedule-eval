# ============================================================
# asr_tolerance — ASR 容错（语音识别错误下的意图理解）
# 配对设计：每个 ASR 错误 case 都有一个正常版本做对照
# ============================================================
asr_tolerance:
  # ---- 对照组：正常输入 ----
  - input: "打开地图"
    expected_action: "open_app"
    operation: direct
    context: empty
    turns: single
    difficulty: easy
    test_goal: "正常对照：打开地图（与'打开地盘'对比）"

  - input: "定个闹钟八点"
    expected_action: "create_schedule"
    expected_time: "08:00"
    user_followups:
      - "早上八点，提醒我吃药"
    operation: direct
    context: empty
    turns: clarify_turn
    difficulty: easy
    test_goal: "正常对照：定闹钟八点，追问后补充内容（与'定个钟八点'对比）"

  - input: "打开D盘看看"
    expected_action: "bash"
    operation: direct
    context: empty
    turns: single
    difficulty: easy
    test_goal: "正常对照：打开D盘文件夹（与'打开地盘'的歧义对比）"

  # ---- ASR 错误组 ----
  - input: "打开地盘"
    expected_action: "open_app"
    expected_action_any: ["open_app", "bash"]
    operation: direct
    context: empty
    turns: single
    difficulty: hard
    test_goal: "ASR谐音：地盘→地图，应识别并打开地图（也可能理解为D盘用bash打开）"

  - input: "打开抖影"
    expected_action: "open_app"
    operation: direct
    context: empty
    turns: single
    difficulty: hard
    test_goal: "ASR谐音：抖影→抖音，应识别并打开抖音"

  - input: "定个钟八点"
    expected_action: "create_schedule"
    expected_time: "08:00"
    user_followups:
      - "早上八点，提醒我吃药"
    operation: direct
    context: empty
    turns: clarify_turn
    difficulty: hard
    test_goal: "ASR吞字：定个钟→定个闹钟，追问后补充内容（与正常版对比）"

  - input: "帮我放个庆余年"
    expected_action: "play_media"
    operation: direct
    context: empty
    turns: single
    difficulty: medium
    test_goal: "口语化：放→播放，应识别为媒体播放"

  - input: "看一下名天有啥安排"
    expected_action: "list_schedules"
    operation: direct
    context: simple
    turns: single
    difficulty: hard
    test_goal: "ASR谐音：名天→明天，应查询明天日程"

