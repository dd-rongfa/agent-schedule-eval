# ==========================================
# Agent 定时任务评测用例集 — 三轴分类体系 (v2.1)
# ==========================================
#
# 方法论演进：
#   v1/v2 初版使用 Bloom's Taxonomy 六层分类，实践中发现不适用于 Agent 评测：
#   - L1"记忆"≠最简单（"设个闹钟"信息缺失，模型追问是正确行为却判 fail）
#   - L4"分析"拆成多轮后反而简单（每轮只做一件事）
#   - L5"评价"不是"更难"，是不同类型的能力
#   核心矛盾：Bloom 把认知层级和信息完整度混为一谈。
#
# 借鉴业界 benchmark 设计：
#   - τ-bench (Sierra 2024): 数据库端态断言，背景复杂度决定难度，pass^k 可靠性
#   - MINT (ICLR 2024): 多轮交互 × 工具使用 × 语言反馈
#   - ToolBench: tool_count × API_complexity × parameter_count
#
# 自研三轴分类：
#   轴1 operation:  操作类型
#       direct   — 信息完整，直接执行
#       clarify  — 信息不全，需追问后执行
#       compound — 多步组合操作（取消+创建、查询+删除）
#       implicit — 隐性意图（"药吃过了" → 取消提醒）
#   轴2 context:    背景复杂度（mock 提醒列表）
#       empty    — 无已有提醒
#       simple   — 2-3 个无歧义提醒
#       rich     — 5+ 个提醒含相似项/干扰项
#   轴3 turns:      对话模式
#       single       — 一条消息搞定
#       clarify_turn — 模型追问 → 用户补充 → 执行
#       correct_turn — 用户反悔 → 修改 → 再修改
#
# 旧 Bloom 标签保留（bloom_level / bloom_tag）以便回溯对比。
# ==========================================

# ============================================================
# direct — 信息完整，直接执行
# ============================================================
direct:
  # --- 创建类（一次性） ---
  - input: "5分钟后提醒我喝水"
    expected_action: "create_schedule"
    operation: direct
    context: empty
    turns: single
    bloom_level: 1
    difficulty: easy
    test_goal: "最简单的创建"

  - input: "10分钟后提醒我吃药"
    expected_action: "create_schedule"
    operation: direct
    context: empty
    turns: single
    bloom_level: 1
    difficulty: easy
    test_goal: "信息完整的标准创建"

  - input: "明天早上8点提醒我开会"
    expected_action: "create_schedule"
    expected_time: "08:00"
    operation: direct
    context: empty
    turns: single
    bloom_level: 2
    difficulty: easy
    test_goal: "绝对时间创建"

  - input: "下午3点半叫我一声"
    expected_action: "create_schedule"
    expected_time: "15:30"
    operation: direct
    context: empty
    turns: single
    bloom_level: 2
    difficulty: easy
    test_goal: "12h→24h 转换 + '叫我'=提醒"

  - input: "今晚23:59提醒我发邮件"
    expected_action: "create_schedule"
    expected_time: "23:59"
    operation: direct
    context: empty
    turns: single
    bloom_level: 3
    difficulty: easy
    test_goal: "精确时间不应被圆整"

  - input: "5分钟后提醒我喝咖啡"
    expected_action: "create_schedule"
    expected_delay_minutes: 5
    operation: direct
    context: empty
    turns: single
    bloom_level: 3
    difficulty: easy
    test_goal: "delay_minutes 精确输出"

  # --- 创建类（周期性） ---
  - input: "每天早上9点提醒我打卡"
    expected_action: "create_recurring"
    expected_recurrence: "daily"
    expected_time: "09:00"
    operation: direct
    context: empty
    turns: single
    bloom_level: 3
    difficulty: medium
    test_goal: "daily 周期任务参数完整"

  - input: "每周一和周五下午6点提醒我写周报"
    expected_action: "create_recurring"
    expected_recurrence: "weekly"
    expected_days: ["monday", "friday"]
    expected_time: "18:00"
    operation: direct
    context: empty
    turns: single
    bloom_level: 3
    difficulty: hard
    test_goal: "多天 weekly + 绝对时间"

  - input: "每隔90分钟提醒我活动一下，连续提醒4次"
    expected_action: "create_recurring"
    expected_interval_minutes: 90
    expected_total_count: 4
    operation: direct
    context: empty
    turns: single
    bloom_level: 3
    difficulty: medium
    test_goal: "非整小时间隔 + 次数限制"

  # --- 查询类 ---
  - input: "我有哪些提醒"
    expected_action: "list_schedules"
    operation: direct
    context: simple
    turns: single
    bloom_level: 1
    difficulty: easy
    test_goal: "基本查询意图"

  - input: "明天有什么安排"
    expected_action: "list_schedules"
    operation: direct
    context: simple
    turns: single
    bloom_level: 2
    difficulty: easy
    test_goal: "带时间过滤的查询"

  # --- 取消类 ---
  - input: "帮我把下午的会议提醒删掉"
    expected_action: "cancel_schedule"
    operation: direct
    context: simple
    turns: single
    bloom_level: 1
    difficulty: easy
    test_goal: "信息较完整的取消"

  - input: "取消那个提醒"
    expected_action: "cancel_schedule"
    operation: direct
    context: simple
    turns: single
    bloom_level: 1
    difficulty: easy
    test_goal: "模糊取消（背景只有1条，无歧义）"

# ============================================================
# clarify — 信息不全，追问后执行
# 每个 case 都带 user_followups，模型追问→用户回答→执行→断言
# ============================================================
clarify:
  - input: "设个闹钟"
    expected_action: "create_schedule"
    user_followups:
      - "明早7点，提醒我起床"
    operation: clarify
    context: empty
    turns: clarify_turn
    bloom_level: 1
    difficulty: easy
    test_goal: "极简输入→追问→补全→执行"

  - input: "每天早上叫我起床"
    expected_action: "create_recurring"
    user_followups:
      - "7点吧"
    operation: clarify
    context: empty
    turns: clarify_turn
    bloom_level: 1
    difficulty: easy
    test_goal: "周期意图缺时间→追问→执行"

  - input: "到点了叫我喝水"
    expected_action: "create_schedule"
    expected_action_any: ["create_schedule", "create_recurring"]
    user_followups:
      - "下午3点"
    operation: clarify
    context: empty
    turns: clarify_turn
    bloom_level: 1
    difficulty: easy
    test_goal: "口语模糊时间→追问→补充→执行（create_recurring也合理）"

  - input: "明早提醒我买菜"
    expected_action: "create_schedule"
    user_followups:
      - "8点"
    operation: clarify
    context: empty
    turns: clarify_turn
    bloom_level: 2
    difficulty: easy
    test_goal: "'明早'模糊→追问确切时间→执行"

  - input: "晚点提醒我回消息"
    expected_action: "create_schedule"
    user_followups:
      - "2小时后吧"
    operation: clarify
    context: empty
    turns: clarify_turn
    bloom_level: 2
    difficulty: medium
    test_goal: "'晚点'太模糊→追问→补时间→执行"

  - input: "提醒我"
    expected_action: "create_schedule"
    user_followups:
      - "下午4点提醒我取快递"
    operation: clarify
    context: empty
    turns: clarify_turn
    bloom_level: 1
    difficulty: easy
    test_goal: "极简（缺时间+内容）→追问→补全→执行"

  - input: "接下来15分钟内，每5分钟给我发一条消息"
    expected_action: "create_recurring"
    user_followups:
      - "内容就是'该休息了'，按刚才说的每5分钟提醒一次就行"
    expected_interval_minutes: 5
    expected_total_count: 3
    operation: clarify
    context: empty
    turns: clarify_turn
    bloom_level: 3
    difficulty: medium
    test_goal: "推算次数 + 追问具体内容"

# ============================================================
# compound — 多步组合操作（单轮指令触发多个工具调用）
# ============================================================
compound:
  - input: "把明天早上8点的会议提醒取消，改成9点"
    expected_actions: ["cancel_schedule", "create_schedule"]
    expected_new_time: "09:00"
    operation: compound
    context: simple
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "一句话拆解：取消+创建"

  - input: "先帮我设一个明天下午3点的提醒开会，然后把今天下午那个取消"
    expected_actions: ["create_schedule", "cancel_schedule"]
    operation: compound
    context: simple
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "识别动作执行顺序"

  - input: "把每天9点的打卡提醒改到8点半，然后再加一个每周五下午5点的周报提醒"
    expected_actions: ["cancel_schedule", "create_recurring", "create_recurring"]
    operation: compound
    context: simple
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "修改+新增混合（三步拆解）"

  - input: "明天的提醒不要了，后天的保留，大后天再加一个"
    expected_actions: ["cancel_schedule", "create_schedule"]
    user_followups:
      - "大后天上午10点，提醒我去银行"
    operation: compound
    context: simple
    turns: clarify_turn
    bloom_level: 4
    difficulty: hard
    test_goal: "选择性操作（保留/取消/创建）+ 追问大后天内容"

  - input: "查一下我有没有重复的提醒，如果有就只保留一个"
    expected_actions: ["list_schedules", "cancel_schedule"]
    operation: compound
    context: simple
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "查询→分析→操作的多步推理链"

  - input: "我今天还有什么事"
    expected_actions: ["get_current_time", "list_schedules"]
    current_time: "2026-04-10 15:00"
    operation: compound
    context: simple
    turns: single
    bloom_level: 2
    difficulty: medium
    test_goal: "隐性查询：日常口语触发 get_time + list"

  # --- 单条消息版 correction（保留原始难题） ---
  - input: "帮我设一个10分钟后的提醒喝水，不对，改成20分钟，算了还是30分钟吧"
    expected_action: "create_schedule"
    expected_final_delay_minutes: 30
    operation: compound
    context: empty
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "单消息连续修改，识别最终意图（30分钟）"

  - input: "先设个5分钟提醒吃药，不对取消，再设10分钟，再取消，最后设15分钟"
    expected_action: "create_schedule"
    expected_final_delay_minutes: 15
    operation: compound
    context: empty
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "单消息多次推翻，追踪最终状态（15分钟）"

# ============================================================
# correct_turn — 多轮修改（用户反悔/纠正）
# ============================================================
correct_turn:
  - input: "帮我设一个10分钟后的提醒，提醒我喝水"
    user_followups:
      - "不对，改成20分钟"
      - "算了还是30分钟吧"
    expected_actions: ["create_schedule", "cancel_schedule"]
    expected_final_delay_minutes: 30
    operation: compound
    context: empty
    turns: correct_turn
    bloom_level: 4
    difficulty: hard
    test_goal: "多轮连续修改（3轮→最终30分钟）"
    expected_end_state:
      task_count: 1
      last_task_content: "喝水"

  - input: "帮我设个5分钟后的提醒，提醒我吃药"
    user_followups:
      - "不对取消掉，设10分钟的"
      - "还是取消，最后设15分钟的"
    expected_actions: ["create_schedule", "cancel_schedule"]
    expected_final_delay_minutes: 15
    operation: compound
    context: empty
    turns: correct_turn
    bloom_level: 4
    difficulty: hard
    test_goal: "多轮反复推翻（3轮→最终15分钟）"
    expected_end_state:
      task_count: 1
      last_task_content: "吃药"

# ============================================================
# implicit — 隐性意图（用户不说"提醒/取消"，Agent 需推导）
# ============================================================
implicit:
  - input: "会开完了"
    expected_actions: ["list_schedules", "update_schedule"]
    current_time: "2026-04-10 15:00"
    operation: implicit
    context: simple
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "隐性完成→查询→标记会议提醒为 completed"

  - input: "药吃过了"
    expected_actions: ["list_schedules", "update_schedule"]
    current_time: "2026-04-10 09:30"
    operation: implicit
    context: simple
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "隐性完成→标记吃药提醒为 completed（单条）"

  - input: "刚收到通知，下午的会取消了"
    expected_actions: ["list_schedules", "cancel_schedule"]
    current_time: "2026-04-10 11:00"
    operation: implicit
    context: simple
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "外部通知→查询→取消会议提醒"

# ============================================================
# rich_context — 同样的指令，但背景中有 5+ 条提醒（含干扰/相似项）
# 用背景复杂度提升难度，而非指令复杂度
# ============================================================
rich_context:
  - input: "药吃过了"
    expected_actions: ["list_schedules", "update_schedule"]
    current_time: "2026-04-10 09:30"
    operation: implicit
    context: rich
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "3条吃药提醒(早/中/晚)，应根据时间标记最近已过的那条（09:00）为 completed"
    note: "对比 implicit 区的单条版本：这里需要从3条中选择正确的1条标记完成"
    mock_tasks:
      - {task_id: "t-1", content: "吃药(早)", time: "09:00", recurrence: null}
      - {task_id: "t-2", content: "吃药(午)", time: "12:00", recurrence: null}
      - {task_id: "t-3", content: "吃药(晚)", time: "21:00", recurrence: null}
      - {task_id: "t-4", content: "喝水", time: "10:00", recurrence: "daily"}
      - {task_id: "t-5", content: "开会", time: "14:00", recurrence: null}
    expected_update_task_id: "t-1"

  - input: "会开完了"
    expected_actions: ["list_schedules", "update_schedule"]
    current_time: "2026-04-10 15:30"
    operation: implicit
    context: rich
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "多条会议提醒中，标记已结束的14:00为 completed，不动16:00的"
    mock_tasks:
      - {task_id: "t-1", content: "部门周会", time: "14:00", recurrence: null}
      - {task_id: "t-2", content: "客户会议", time: "16:00", recurrence: null}
      - {task_id: "t-3", content: "喝水", time: "09:00", recurrence: "daily"}
      - {task_id: "t-4", content: "喝水", time: "15:00", recurrence: "daily"}
      - {task_id: "t-5", content: "吃药", time: "12:00", recurrence: null}
    expected_update_task_id: "t-1"

  - input: "取消那个提醒"
    expected_action: "cancel_schedule"
    user_followups:
      - "就是那个开会的"
    operation: clarify
    context: rich
    turns: clarify_turn
    bloom_level: 1
    difficulty: hard
    test_goal: "5+条提醒中模糊取消→追问→用户指定→取消"
    note: "在 rich 背景下，'那个'是歧义的，模型应追问"
    mock_tasks:
      - {task_id: "t-1", content: "喝水", time: "09:00", recurrence: "daily"}
      - {task_id: "t-2", content: "喝水", time: "15:00", recurrence: "daily"}
      - {task_id: "t-3", content: "开会", time: "14:00", recurrence: null}
      - {task_id: "t-4", content: "吃药", time: "09:00", recurrence: null}
      - {task_id: "t-5", content: "打卡", time: "09:00", recurrence: "daily"}

  - input: "部署完了"
    expected_actions: ["list_schedules", "update_schedule"]
    current_time: "2026-04-10 16:00"
    operation: implicit
    context: rich
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "系统运维场景：程序部署完成→标记部署检查提醒为 completed"
    mock_tasks:
      - {task_id: "t-1", content: "检查部署状态", time: "16:30", recurrence: null}
      - {task_id: "t-2", content: "检查部署状态", time: "17:00", recurrence: null}
      - {task_id: "t-3", content: "喝水", time: "09:00", recurrence: "daily"}
      - {task_id: "t-4", content: "站会", time: "10:00", recurrence: "daily"}
      - {task_id: "t-5", content: "吃药", time: "12:00", recurrence: null}

  - input: "查一下我有没有重复的提醒，如果有就只保留一个"
    expected_actions: ["list_schedules", "cancel_schedule"]
    operation: compound
    context: rich
    turns: single
    bloom_level: 4
    difficulty: hard
    test_goal: "rich背景下去重：2条喝水09:00完全重复，应取消1条"
    mock_tasks:
      - {task_id: "t-1", content: "喝水", time: "09:00", recurrence: "daily"}
      - {task_id: "t-2", content: "喝水", time: "09:00", recurrence: "daily"}
      - {task_id: "t-3", content: "开会", time: "14:00", recurrence: null}
      - {task_id: "t-4", content: "吃药", time: "09:00", recurrence: null}
      - {task_id: "t-5", content: "打卡", time: "09:00", recurrence: "daily"}

# ============================================================
# tool_selection — 工具干扰（多工具场景下选对工具）
# 新增工具：manage_todo, play_media, open_app
# ============================================================
tool_selection:
  - input: "帮我记一下明天要买牛奶"
    expected_action: "create_todo"
    operation: direct
    context: empty
    turns: single
    difficulty: medium
    test_goal: "'记一下'→待办事项，不应创建定时提醒"

  - input: "三点提醒我开会"
    expected_action: "create_schedule"
    expected_time: "15:00"
    operation: direct
    context: empty
    turns: single
    difficulty: medium
    test_goal: "'提醒我'+具体时间→定时提醒，不是待办"

  - input: "播放庆余年第六集"
    expected_action: "play_media"
    operation: direct
    context: empty
    turns: single
    difficulty: easy
    test_goal: "明确的媒体播放指令"

  - input: "帮我把吃药的提醒去掉"
    expected_action: "cancel_schedule"
    operation: direct
    context: simple
    turns: single
    difficulty: medium
    test_goal: "'提醒去掉'→取消日程提醒，不是删除待办"
    mock_tasks:
      - {task_id: "t-1", content: "吃药", time: "09:00", recurrence: null}
      - {task_id: "t-2", content: "喝水", time: "15:00", recurrence: "daily"}

  - input: "刚才的待办做完了"
    expected_action: "complete_todo"
    operation: implicit
    context: simple
    turns: single
    difficulty: medium
    test_goal: "'待办做完了'→完成待办，不是取消提醒"
    mock_todos:
      - {todo_id: "todo-1", content: "写周报", status: "pending", due_date: null}

  - input: "帮我打开抖音"
    expected_action: "open_app"
    operation: direct
    context: empty
    turns: single
    difficulty: easy
    test_goal: "'打开'+应用名→启动应用"

  - input: "打开D盘"
    expected_action: "bash"
    operation: direct
    context: empty
    turns: single
    difficulty: medium
    test_goal: "打开磁盘目录→应使用 bash(start D:\\)，不是 open_app"

  - input: "把微信关了"
    expected_action: "control_window"
    operation: direct
    context: empty
    turns: single
    difficulty: medium
    test_goal: "关闭应用→应使用 control_window(close)，不是 bash"

# ============================================================
# temporal_reasoning — 时序推理（跨工具的时间/状态推理）
# ============================================================
temporal_reasoning:
  - input: "上次看到第几集了"
    expected_action: "get_play_history"
    operation: direct
    context: simple
    turns: single
    difficulty: easy
    test_goal: "查询播放进度→调用播放历史"

  - input: "继续看庆余年"
    expected_action: "play_media"
    operation: implicit
    context: simple
    turns: single
    difficulty: medium
    test_goal: "隐性续播（点名）→应调用 play_media（可能先查历史）"
    mock_media:
      - {media_id: "media-1", title: "庆余年", type: "tv", current_episode: 5, total_episodes: 46}

  - input: "接着看吧"
    expected_action: "play_media"
    expected_action_any: ["play_media", "get_play_history"]
    operation: implicit
    context: simple
    turns: single
    difficulty: hard
    test_goal: "隐性续播（不点名）→应先查历史再播放，或直接续播"
    mock_media:
