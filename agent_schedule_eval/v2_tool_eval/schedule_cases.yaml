# ============================================================
# 手动实测用例（不参与自动化评测）
# ============================================================
manual_test_prompts:
  - id: "MT-01"
    description: "高频重复任务是否正确触发"
    prompts:
      - "接下来15分钟内，每5分钟给我发一条消息"
    observe:
      - "是否创建了3次触发"
      - "消息内容是否合理"

  - id: "MT-02"
    description: "创建后立即取消"
    prompts:
      - "5分钟后提醒我喝水"
      - "刚才那个取消掉"
    observe:
      - "是否成功创建再取消"

  - id: "MT-03"
    description: "动态修改三次（已是自动化 correct_turn case）"
    prompts:
      - "帮我设一个10分钟后的提醒，提醒我喝水"
      - "不对，改成20分钟"
      - "算了还是30分钟吧"
    observe:
      - "每次修改后旧任务是否取消"
      - "最终是否只有30分钟的任务"

  - id: "MT-04"
    description: "跨天边界时间处理"
    prompts:
      - "今晚11点55分提醒我，然后明天早上6点再提醒我"
    observe:
      - "是否创建了两条提醒"
      - "时间是否跨天正确处理"

# ============================================================
# status_aware — 状态感知决策（v2.1 新增）
# 提醒带有生命周期状态：pending → triggered → completed / expired
# 系统负责触发（pending→triggered），大模型负责根据状态做语义决策
# ============================================================
status_aware:
  - input: "药吃过了"
    expected_action: "update_schedule"
    expected_status: "completed"
    operation: implicit
    context: simple
    turns: single
    difficulty: medium
    test_goal: "已触发的提醒，用户确认完成→应 update 为 completed，不能 cancel"
    mock_tasks:
      - {task_id: "sch-1", content: "吃药提醒", time: "08:00", status: "triggered"}
      - {task_id: "sch-2", content: "喝水", time: "15:00", recurrence: "daily", status: "pending"}

  - input: "刚才下午开会的提醒没看到，5分钟后再提醒我一次"
    expected_action: "create_schedule"
    operation: implicit
    context: simple
    turns: single
    difficulty: medium
    test_goal: "已触发但用户没注意到→应重新创建一条新提醒（含明确内容和时间）"
    mock_tasks:
      - {task_id: "sch-1", content: "下午开会", time: "14:00", status: "triggered"}

  - input: "下午的会取消了"
    expected_action: "cancel_schedule"
    operation: direct
    context: simple
    turns: single
    difficulty: easy
    test_goal: "pending 状态的提醒→正常取消"
    mock_tasks:
      - {task_id: "sch-1", content: "下午开会", time: "14:00", status: "pending"}
      - {task_id: "sch-2", content: "喝水", time: "15:00", recurrence: "daily", status: "pending"}

  - input: "取消吃药提醒"
    expected_action: "cancel_schedule"
    expected_action_any: ["cancel_schedule", "update_schedule", "list_schedules"]
    operation: direct
    context: simple
    turns: single
    difficulty: hard
    test_goal: "已触发的提醒被要求取消→取消或标记完成均可接受"
    mock_tasks:
      - {task_id: "sch-1", content: "吃药提醒", time: "08:00", status: "triggered"}

  - input: "还有哪些提醒没发？"
    expected_action: "list_schedules"
    operation: direct
    context: rich
    turns: single
    difficulty: medium
    test_goal: "混合状态下查询→应返回列表并识别出 pending 的"
    mock_tasks:
      - {task_id: "sch-1", content: "吃药提醒", time: "08:00", status: "triggered"}
      - {task_id: "sch-2", content: "下午开会", time: "14:00", status: "pending"}
      - {task_id: "sch-3", content: "晨跑提醒", time: "07:00", status: "expired"}
      - {task_id: "sch-4", content: "接孩子", time: "16:30", status: "pending"}
      - {task_id: "sch-5", content: "买菜", time: "18:00", status: "pending"}

  - input: "早上的健身提醒怎么没响？"
    expected_action: "list_schedules"
    expected_action_any: ["list_schedules", "update_schedule"]
    operation: implicit
    context: simple
    turns: single
    difficulty: hard
    test_goal: "过期的提醒→应告知已过期，可建议重新设置"
    mock_tasks:
      - {task_id: "sch-1", content: "晨跑健身", time: "07:00", status: "expired"}
      - {task_id: "sch-2", content: "喝水", time: "15:00", recurrence: "daily", status: "pending"}

# ============================================================
# chain_reasoning — 链式推理（v2.1 新增）
# 查状态 → 数值推理 → 设提醒。测模型从工具返回数据中推算时间的能力。
# ============================================================
chain_reasoning:
  - input: "评测脚本跑到哪了？跑完了提醒我"
    expected_actions: ["check_task_status", "create_schedule"]
    expected_delay_minutes_range: [120, 150]
    operation: compound
    context: simple
    turns: single
    difficulty: medium
    test_goal: "查任务进度→计算剩余时间→设定提醒（200/2000完成10%, 15min已过→~135min剩余）"
    mock_running_tasks:
      - {task_id: "eval-001", command: "python run_eval.py", status: "running",
         progress: "200/2000", elapsed_min: 15, log_tail: "Processing batch 4/40..."}

  - input: "脚本跑完没？"
    expected_action: "check_task_status"
    operation: direct
    context: simple
    turns: single
    difficulty: easy
    test_goal: "已完成的任务→查询后告知结果，不应多此一举设提醒"
    mock_running_tasks:
      - {task_id: "eval-001", command: "python run_eval.py", status: "completed",
         progress: "2000/2000", elapsed_min: 142, log_tail: "All done. 2000 samples evaluated."}

  - input: "有什么在跑的任务吗"
    expected_action: "check_task_status"
    operation: direct
    context: empty
    turns: single
    difficulty: easy
    test_goal: "无运行任务→查询后告知当前没有任务"
