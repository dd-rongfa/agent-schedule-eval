# ==========================================
# Agent 定时任务评测用例集 — Bloom's Taxonomy 分层设计
# ==========================================
#
# 理论依据：Bloom's Taxonomy（修订版，Anderson & Krathwohl 2001）
# 参考论文：Huber & Niklaus, "LLMs meet Bloom's Taxonomy", COLING 2025
#
# 设计原则：
#   - 每一层级 ≥ 3 个用例，覆盖不同语言风格
#   - 难度随层级递增，L1→L6 对应 easy→hard
#   - 每个用例标注所属 Bloom 层级 + 测试目标
#   - 自动化用例 (Layer 1/2) 和手动实测用例 (manual) 分开
#
# 多维度标注说明（v2 新增）：
#   time_complexity:    时间表达复杂度 (simple / fuzzy / relative / multi_constraint)
#   intent_clarity:     意图明确度 (explicit / implicit / ambiguous)
#   action_count:       需要的动作数量 (single / multi)
#   info_completeness:  信息完整度 (complete / partial / missing)
#   context_dependency: 是否依赖上下文/外部知识 (none / dialogue / world_knowledge)
# ==========================================

# ============================================================
# L1 — Remember (记忆)
# 认知动词：识别、回忆、列举
# Agent 能力：识别这是一条定时任务请求，知道该调用哪个工具
# 测试目标：不测时间解析精度，只测"能否识别意图类型"
# ============================================================
L1_remember:
  - input: "5分钟后提醒我喝水"
    expected_action: "create_schedule"
    bloom_level: 1
    bloom_tag: "remember"
    test_goal: "识别简单定时创建意图"
    difficulty: easy
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: complete
    context_dependency: none

  - input: "取消那个提醒"
    expected_action: "cancel_schedule"
    bloom_level: 1
    bloom_tag: "remember"
    test_goal: "识别取消意图"
    difficulty: easy
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: dialogue

  - input: "每天早上叫我起床"
    expected_action: "create_recurring"
    bloom_level: 1
    bloom_tag: "remember"
    test_goal: "识别周期性任务意图"
    difficulty: easy
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: none

  - input: "设个闹钟"
    expected_action: "create_schedule"
    bloom_level: 1
    bloom_tag: "remember"
    test_goal: "极简输入下仍能识别创建意图（但缺乏参数）"
    difficulty: easy
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: missing
    context_dependency: none

# ============================================================
# L2 — Understand (理解)
# 认知动词：解释、推断、转述
# Agent 能力：正确解析口语化、模糊、隐含的时间表达
# 测试目标：同义表达识别、模糊时间推断
# ============================================================
L2_understand:
  - input: "明天早上8点提醒我开会"
    expected_action: "create_schedule"
    expected_time: "08:00"
    expected_content: "开会"
    bloom_level: 2
    bloom_tag: "understand"
    test_goal: "理解'明天早上8点'这种标准时间表达"
    difficulty: easy
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: complete
    context_dependency: none

  - input: "下午3点半叫我一声"
    expected_action: "create_schedule"
    expected_time: "15:30"
    expected_content: "提醒"
    bloom_level: 2
    bloom_tag: "understand"
    test_goal: "12小时制→24小时制转换"
    difficulty: easy
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: complete
    context_dependency: none

  - input: "明早提醒我买菜"
    expected_action: "create_schedule"
    expected_time_range: ["06:00", "09:00"]
    bloom_level: 2
    bloom_tag: "understand"
    test_goal: "模糊时间'明早'推断为合理范围"
    note: "Agent 应给出合理默认值或追问"
    difficulty: medium
    time_complexity: fuzzy
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: world_knowledge

  - input: "后天中午提醒我约饭"
    expected_action: "create_schedule"
    expected_time_range: ["11:30", "12:30"]
    bloom_level: 2
    bloom_tag: "understand"
    test_goal: "'中午'是模糊概念，需推断"
    difficulty: medium
    time_complexity: fuzzy
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: world_knowledge

# ============================================================
# L3 — Apply (应用)
# 认知动词：执行、实施、使用
# Agent 能力：将请求正确转化为结构化参数（JSON 字段精确）
# 测试目标：参数准确性，能被系统直接消费
# ============================================================
L3_apply:
  - input: "5分钟后提醒我喝水"
    expected_action: "create_schedule"
    expected_delay_minutes: 5
    expected_content: "喝水"
    bloom_level: 3
    bloom_tag: "apply"
    test_goal: "相对时间→delay_minutes 精确输出"
    difficulty: easy
    time_complexity: relative
    intent_clarity: explicit
    action_count: single
    info_completeness: complete
    context_dependency: none

  - input: "每天早上9点提醒我打卡"
    expected_action: "create_recurring"
    expected_recurrence: "daily"
    expected_time: "09:00"
    bloom_level: 3
    bloom_tag: "apply"
    test_goal: "周期任务参数结构完整性"
    difficulty: medium
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: complete
    context_dependency: none

  - input: "每周一和周五下午6点提醒我写周报"
    expected_action: "create_recurring"
    expected_recurrence: "weekly"
    expected_days: ["monday", "friday"]
    expected_time: "18:00"
    bloom_level: 3
    bloom_tag: "apply"
    test_goal: "多天周期 + 绝对时间的复杂参数"
    difficulty: hard
    time_complexity: multi_constraint
    intent_clarity: explicit
    action_count: single
    info_completeness: complete
    context_dependency: none

  - input: "接下来15分钟内，每5分钟给我发一条消息"
    expected_action: "create_recurring"
    expected_interval_minutes: 5
    expected_total_count: 3
    bloom_level: 3
    bloom_tag: "apply"
    test_goal: "从时间范围+间隔推算出次数"
    difficulty: medium
    time_complexity: relative
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: none

# ============================================================
# L4 — Analyze (分析)
# 认知动词：分解、区分、组织
# Agent 能力：从复杂/复合指令中拆解出多个步骤或修正意图
# 测试目标：多动作拆解、犹豫修改处理
# ============================================================
L4_analyze:
  - input: "把明天早上8点的会议提醒取消，改成9点"
    expected_actions: ["cancel_schedule", "create_schedule"]
    expected_new_time: "09:00"
    bloom_level: 4
    bloom_tag: "analyze"
    test_goal: "一句话中拆解出取消+创建两个动作"
    difficulty: hard
    time_complexity: simple
    intent_clarity: explicit
    action_count: multi
    info_completeness: complete
    context_dependency: none

  - input: "先帮我设一个明天下午3点的提醒，然后把今天下午那个取消"
    expected_actions: ["create_schedule", "cancel_schedule"]
    bloom_level: 4
    bloom_tag: "analyze"
    test_goal: "识别动作执行顺序（先创建后取消）"
    difficulty: hard
    time_complexity: simple
    intent_clarity: explicit
    action_count: multi
    info_completeness: partial
    context_dependency: dialogue

  - input: "帮我设一个10分钟后的提醒，不对，改成20分钟，算了还是30分钟吧"
    expected_action: "create_schedule"
    expected_final_delay_minutes: 30
    bloom_level: 4
    bloom_tag: "analyze"
    test_goal: "连续修改中识别最终意图"
    difficulty: hard
    time_complexity: relative
    intent_clarity: explicit
    action_count: multi
    info_completeness: partial
    context_dependency: dialogue

  - input: "先设个5分钟提醒，不对取消，再设10分钟，再取消，最后设15分钟"
    expected_action: "create_schedule"
    expected_final_delay_minutes: 15
    bloom_level: 4
    bloom_tag: "analyze"
    test_goal: "多次推翻中追踪最终状态"
    difficulty: hard
    time_complexity: relative
    intent_clarity: explicit
    action_count: multi
    info_completeness: partial
    context_dependency: dialogue

# ============================================================
# L5 — Evaluate (评价)
# 认知动词：判断、批判、决策
# Agent 能力：判断请求是否合理，决定执行/拒绝/追问
# 测试目标：边界检测、信息充分性判断
# ============================================================
L5_evaluate:
  - input: "昨天下午3点提醒我开会"
    expected_action: "reject_or_clarify"
    bloom_level: 5
    bloom_tag: "evaluate"
    test_goal: "识别过去时间并拒绝或追问"
    note: "过去时间，应拒绝或追问用户是否想设明天"
    difficulty: medium
    time_complexity: simple
    intent_clarity: explicit
    action_count: single
    info_completeness: complete
    context_dependency: world_knowledge

  - input: "提醒我"
    expected_action: "clarify"
    bloom_level: 5
    bloom_tag: "evaluate"
    test_goal: "判断信息不足（缺时间和内容），主动追问，不应声明会执行 create_schedule"
    difficulty: easy
    time_complexity: simple
    intent_clarity: ambiguous
    action_count: single
    info_completeness: missing
    context_dependency: none

  - input: "晚点提醒我回消息"
    expected_action: "clarify"
    bloom_level: 5
    bloom_tag: "evaluate"
    test_goal: "判断'晚点'太模糊，需要追问具体时间，不应同时声明会调用 create_schedule"
    difficulty: medium
    time_complexity: fuzzy
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: world_knowledge

  - input: "过一会儿提醒我关火"
    expected_action: "clarify_or_create"
    bloom_level: 5
    bloom_tag: "evaluate"
    test_goal: "紧急性判断：关火可能紧急，需权衡模糊时间vs紧急度"
    note: "高水平Agent应意识到'关火'的紧急性，给出短默认值或追问"
    difficulty: hard
    time_complexity: fuzzy
    intent_clarity: implicit
    action_count: single
    info_completeness: partial
    context_dependency: world_knowledge

  - input: "随便什么时候提醒我就行"
    expected_action: "clarify_or_create"
    bloom_level: 5
    bloom_tag: "evaluate"
    test_goal: "完全无时间信息时的决策"
    difficulty: medium
    time_complexity: fuzzy
    intent_clarity: ambiguous
    action_count: single
    info_completeness: missing
    context_dependency: none

# ============================================================
# L6 — Create (创造)
# 认知动词：设计、规划、构建
# Agent 能力：处理前所未见的复杂场景，自主组织解决方案
# 测试目标：创造性规划、多约束满足
# ============================================================
L6_create:
  - input: "每两小时提醒我一次，但只在工作时间（9点到6点），午休12点到1点跳过"
    expected_action: "create_recurring"
    expected_final_interval_hours: 2
    expected_time_range: ["09:00", "18:00"]
    expected_exclude: ["12:00", "13:00"]
    bloom_level: 6
    bloom_tag: "create"
    test_goal: "多约束条件下的自主方案设计"
    difficulty: hard
    time_complexity: multi_constraint
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: none

  - input: "帮我规划一个考试复习提醒：接下来一周，每天晚上两小时前提醒我开始复习，但周末改成早上"
    expected_action: "create_recurring"
    bloom_level: 6
    bloom_tag: "create"
    test_goal: "条件分支（工作日vs周末）+ 相对时间计算"
    note: "Agent需要理解'两小时前'是相对于某个事件，可能需追问考试时间"
    difficulty: hard
    time_complexity: multi_constraint
    intent_clarity: explicit
    action_count: single
    info_completeness: partial
    context_dependency: world_knowledge

  - input: "我有三个药要吃：A药饭前30分钟，B药饭后1小时，C药睡前。帮我设提醒"
    expected_action: "create_schedule"
    bloom_level: 6
    bloom_tag: "create"
    test_goal: "多实体+相对时间参照物（饭点/睡觉时间）"
    note: "Agent无法确定饭点和睡觉时间，应追问后规划"
    difficulty: hard
    time_complexity: multi_constraint
    intent_clarity: explicit
    action_count: multi
    info_completeness: partial
    context_dependency: world_knowledge

# ============================================================
# 手动实测用例（不参与自动化评测）
# ============================================================
manual_test_prompts:
  - id: "MT-01"
    bloom_level: 3
    description: "apply: 高频重复任务是否正确触发"
    prompts:
      - "接下来15分钟内，每5分钟给我发一条消息"
    observe:
      - "是否创建了3次触发（5/10/15分钟后）"
      - "实际触发时间是否准确"
      - "消息内容是否合理"

  - id: "MT-02"
    bloom_level: 4
    description: "analyze: 创建后立即取消"
    prompts:
      - "5分钟后提醒我喝水"
      - "刚才那个取消掉"
    observe:
      - "第一条：是否成功创建提醒"
      - "第二条：是否正确识别并取消了刚创建的任务"
      - "是否真的不触发了"

  - id: "MT-03"
    bloom_level: 4
    description: "analyze: 动态修改三次"
    prompts:
      - "10分钟后提醒我"
      - "改成20分钟"
      - "算了还是30分钟"
    observe:
      - "每次修改后，旧任务是否取消"
      - "最终是否只有30分钟的任务存在"
      - "最终触发时间是否正确"

  - id: "MT-04"
    bloom_level: 5
    description: "evaluate: 跨天边界时间处理"
    prompts:
      - "今晚11点55分提醒我，然后明天早上6点再提醒我"
    observe:
      - "是否创建了两条提醒"
      - "时间是否跨天正确处理"
      - "两条提醒是否都实际触发"
