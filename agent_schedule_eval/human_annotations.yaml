# 人工标注模板 v2
# 用途：给 results.jsonl 中挑选出来的样本做人类评分，用于验证 LLM-as-a-Judge
#
# ════════════════════════════════════════════════════
# 评分量表 (Scoring Rubric) — 共 5 个维度，每维度 0.2 分
# ════════════════════════════════════════════════════
#
# 维度 A：动作识别（0.2 分）
#   0.2 = 选对了正确的动作（create_schedule / cancel_schedule / clarify 等）
#   0.1 = 动作部分正确（如：该 clarify 但说了 create_schedule，不过后面又追问了）
#   0.0 = 动作完全错误
#
# 维度 B：时间解析（0.2 分）
#   0.2 = 时间理解完全正确（5分钟后=5min、明早=合理默认值、中午=12:00左右）
#   0.1 = 时间大致正确但有偏差（如：明早默认10:00，不太合理但也不算错）
#   0.0 = 时间理解错误或完全忽略
#   N/A = 输入中没有时间信息（如"提醒我"），此维度跳过，0.2 分均摊到其他维度
#
# 维度 C：完整性判断（0.2 分）
#   0.2 = 正确判断信息是否充足：该追问的追问了，不该追问的没多此一举
#   0.1 = 判断基本对但有小问题（如：信息够了但还是追问了一个可选项）
#   0.0 = 该追问没追问（信息不足却直接执行）或不该追问却追问了
#
# 维度 D：不编造（0.2 分）
#   0.2 = 没有捏造任何不存在的信息
#   0.1 = 轻微编造（如：给了示例时间"比如8点"，但不影响核心判断）
#   0.0 = 严重编造（捏造了具体时间/内容并当作确定信息使用）
#
# 维度 E：语用与上下文（0.2 分）
#   0.2 = 考虑了语境、紧急性、常识等（如：关火→紧急、昨天→过去时间）
#   0.1 = 部分考虑（识别了问题但处理不够好）
#   0.0 = 完全忽略语境因素
#   N/A = 该 case 不涉及特殊语用推理，此维度跳过，0.2 分均摊到其他维度
#
# ────────────────────────────────────────────────────
# human_score = A + B + C + D + E（各维度分数之和，满分 1.0）
# human_pass = human_score >= 0.7
# rationale = 简要说明每个维度的判断理由
#
# 注意：如果某维度标 N/A，则该 0.2 分平均分配给剩余维度
# 例如：4 个有效维度，每维度满分变为 0.25，总分仍为 1.0
# 实际操作中不需要精确计算，用 0.2 步进打分即可
# ════════════════════════════════════════════════════

annotations:
  - id: "A01"
    input: "5分钟后提醒我喝水"
    bloom_level: 1
    actual_output: |
      create_schedule  
      我会在5分钟后提醒你喝水。
    expected_summary: "create_schedule + 5分钟后 + 喝水"
    dim_A_action: 0.2
    dim_B_time: 0.2
    dim_C_completeness: 0.2
    dim_D_no_hallucination: 0.2
    dim_E_pragmatics: 0.2
    human_score: 1.0
    human_pass: true
    rationale: "A=0.2 动作正确; B=0.2 时间正确; C=0.2 无多余追问; D=0.2 无编造; E=0.2 无特殊语境"

  - id: "A02"
    input: "后天中午提醒我约饭"
    bloom_level: 2
    actual_output: |
      create_schedule  
      我会在**后天中午12:00**（基于当前时间推算）设置提醒，内容为“约饭”。
    expected_summary: "create_schedule + 中午合理解释或追问"
    human_score: 1.0
    human_pass: true
    rationale: "动作、时间、内容都正确，没有多余编造。"

  - id: "A03"
    input: "把明天早上8点的会议提醒取消，改成9点"
    bloom_level: 4
    actual_output: |
      cancel_schedule  
      我会取消原定明天早上8点的会议提醒，并创建新的提醒：明天早上9点，内容为“会议”。
    expected_summary: "cancel + create + 新时间9点"
    human_score: 1.0
    human_pass: true
    rationale: "动作、时间、内容都正确，没有多余编造。"

  - id: "A04"
    input: "先设个5分钟提醒，不对取消，再设10分钟，再取消，最后设15分钟"
    bloom_level: 4
    actual_output: |
      create_schedule  
      用户最终要求设置15分钟后的提醒，内容未指定，我会将提醒内容设为“用户自定义提醒”。
    expected_summary: "最终应追踪到15分钟"
    human_score: 0.8
    human_pass: true
    rationale: "动作正确，最终时间正确，虽然过程复杂但结果正确。"

  - id: "A05"
    input: "过一会儿提醒我关火"
    bloom_level: 5
    actual_output: |
      create_schedule  
      用户提供了提醒内容“关火”，时间描述“过一会儿”可以合理推断为几分钟后（例如5-10分钟）。我会创建一个几分钟后的单次提醒。
    expected_summary: "应体现紧急性，至少明确是 clarify_or_create"
    dim_A_action: 0.1
    dim_B_time: 0.2
    dim_C_completeness: 0.2
    dim_D_no_hallucination: 0.2
    dim_E_pragmatics: 0.0
    human_score: 0.0
    human_pass: false
    rationale: "0.0 忽略紧急性"

  - id: "A06"
    input: "帮我规划一个考试复习提醒：接下来一周，每天晚上两小时前提醒我开始复习，但周末改成早上"
    bloom_level: 6
    actual_output: |
      create_recurring  
      用户要求接下来一周（从今天起连续7天）的周期性提醒：工作日（周一到周五）在晚上开始复习前两小时提醒，周末（周六、周日）改成早上提醒。  
      - 周期规则：每天重复，持续7天  
      - 时间参数：工作日为晚上复习开始时间前两小时（需推断晚上复习时间，若未指定则默认晚7点开始复习，即下午5点提醒）；周末为早上（若未指定具体时间则默认早上8点）  
      - 提醒内容：开始复习
    expected_summary: "create_recurring + 不应捏造具体时间 + 应追问参考事件"
    human_score: 0.6
    human_pass: false
    rationale: "知道要追问，但编造了示例时间，降低可信度。"

  - id: "A07"
    input: "取消那个提醒"
    bloom_level: 1
    actual_output: |
      cancel_schedule  
      我需要取消一个已存在的提醒，但用户没有指定具体是哪一个。由于“取消”操作通常需要明确目标，而这里信息不足，我无法直接执行。不过根据规则，如果关键信息缺失应选 clarify，但此处“取消”动作本身已明确，只是缺少目标标识，因此我选择执行类动作，并假设系统能通过上下文或默认项处理。
    expected_summary: "clarify + 追问要取消哪个提醒（缺目标信息应先追问）"
    human_score: 0.2
    human_pass: false
    rationale: "动作错误，且表述矛盾,应该追问具体哪个提醒。"

  - id: "A08"
    input: "设个闹钟"
    bloom_level: 1
    actual_output: |
      clarify  
      用户只说了“设个闹钟”，但未提供任何时间信息（如几点、几分钟后、周期等）和提醒内容，关键信息严重缺失，无法合理推断。我会追问具体时间和提醒事项。
    expected_summary: "clarify + 追问时间和内容（关键信息严重缺失）"
    human_score: 1.0
    human_pass: true
    rationale: "动作正确选了 clarify，合理追问了时间和提醒事项。"

  - id: "A09"
    input: "明早提醒我买菜"
    bloom_level: 2
    actual_output: |
      create_schedule  
      我会在明天早上（默认早上8点）提醒你“买菜”。
    expected_summary: "create_schedule + 明早→合理默认值或追问"
    human_score: 0.8
    human_pass: true
    rationale: "动作正确，合理使用默认时间，无需追问。"

  - id: "A10"
    input: "每周一和周五下午6点提醒我写周报"
    bloom_level: 3
    actual_output: |
      create_recurring  
      我会创建一个周期性提醒，规则为“每周一和周五下午6点”，提醒内容为“写周报”。
    expected_summary: "create_recurring + weekly + 18:00 + monday/friday"
    human_score: 1.0
    human_pass: true
    rationale: "动作正确，时间和内容都正确，周期规则正确，无需追问。"

  - id: "A11"
    input: "接下来15分钟内，每5分钟给我发一条消息"
    bloom_level: 3
    actual_output: |
      create_recurring  
      用户要求在接下来的15分钟内，每5分钟发送一次提醒。这是一个周期性提醒任务。  
      - **开始时间**：从现在开始  
      - **结束时间**：15分钟后  
      - **周期规则**：每5分钟一次  
      - **提醒内容**：用户未指定具体消息内容，但根据上下文“给我发一条消息”，可以合理推断提醒内容为“消息”或类似提示。因此，我会将提醒内容设置为“消息”。
    expected_summary: "create_recurring + interval=5min + count=3"
    human_score: 1.0
    human_pass: true
    rationale: "动作正确，合理追问提醒内容。"

  - id: "A12"
    input: "先帮我设一个明天下午3点的提醒，然后把今天下午那个取消"
    bloom_level: 4
    actual_output: |
      create_schedule & cancel_schedule  
      我会先取消今天下午的提醒（需要您提供具体时间或内容来匹配），然后为您创建明天下午3点的提醒，内容待您补充。
    expected_summary: "先 create 后 cancel，顺序正确 + 合理追问"
    human_score: 0.6
    human_pass: false
    rationale: "动作顺序错误（先取消再创建），缺乏追问取消目标。0.6 < 0.7 阈值。"

  - id: "A13"
    input: "昨天下午3点提醒我开会"
    bloom_level: 5
    actual_output: |
      create_schedule  
      我会创建一个提醒，内容为“开会”，时间设定为昨天下午3点。但请注意，这个时间已经过去，提醒可能无法及时生效。
    expected_summary: "reject 或 clarify，不应直接创建过去时间的提醒"
    human_score: 0.0
    human_pass: false
    rationale: "动作错误，不应该直接创建一个已经过去的提醒，应该拒绝或追问。"

  - id: "A14"
    input: "晚点提醒我回消息"
    bloom_level: 5
    actual_output: |
      clarify  
      原因：用户提到“晚点提醒我回消息”，但未指定具体时间（例如“10分钟后”或“晚上8点”），时间信息严重缺失，无法合理推断何时提醒。我会追问：“请问具体在什么时间提醒您？”
    expected_summary: "clarify，'晚点'太模糊不应直接执行"
    human_score: 1.0
    human_pass: true
    rationale: "动作正确，合理追问具体时间。"

  - id: "A15"
    input: "我有三个药要吃：A药饭前30分钟，B药饭后1小时，C药睡前。帮我设提醒"
    bloom_level: 6
    actual_output: |
      clarify  
      我需要追问具体的时间点或相对时间。你提到了“饭前30分钟”“饭后1小时”“睡前”，但没有说明三餐的具体时间或睡觉时间，无法设置提醒。我会问：“请告诉我早餐、午餐、晚餐和睡觉的具体时间，比如早餐7点、午餐12点、晚餐18点、睡觉22点，这样我才能设置提醒。”
    expected_summary: "clarify + 追问饭点和睡觉时间（缺关键时间参照）"
    human_score: 0.8
    human_pass: true
    rationale: "动作正确选了 clarify，追问了三餐和睡觉时间，逻辑清晰。轻微编造了示例时间扣0.2。"

