title: "Nanobot Live Test Plan — 简版清单"
usage: "给人看、手工执行，不追求程序可执行性"
status: "T1 仅观察，不计入最终通过率；其余 9 个 case 可正常补测"
timing_note: "建议优先在白天/下午执行。凌晨会改变 T1/T9 的语义边界（‘明天’‘上午/下午’），也更容易放大秒级提醒的 current-time 漂移。"

before_start:
  - "清空旧 session 文件"
  - "重启 gateway / bot"
  - "Telegram 里先发 /new"
  - "发一句 hi，确认 bot 正常回复"

model_switch:
  - "把 nanobot 配置里的 model 改成你要测的那个"
  - "当前建议补测：deepseek-reasoner"
  - "每换一个模型，重新 /new，再从 S1 开始"

sessions:
  - session: "S1 核心链路：创建 → 查询 → 修改"
    prompts:
      - "五分钟之后叫我一声"
      - "我的提醒设好了没？"
      - "把刚才那个提醒改成10分钟后"
    watch:
      - "能不能创建一次性提醒（不是循环提醒）"
      - "能不能正确查到刚才的提醒"
      - "能不能理解‘刚才那个’并改对"
    after: "/new"

  - session: "S2 工具干扰"
    prompts:
      - "帮我算一下 128 乘以 256 等于多少"
    watch:
      - "不要误触 cron"
      - "答案应是 32768"
    after: "/new"

  - session: "S3 过去时间"
    prompts:
      - "帮我设一个昨天下午3点的提醒"
    watch:
      - "应该拒绝，或明确说时间已过"
      - "不要默默创建一个过去时间任务"
    after: "/new"

  - session: "S4 幻觉探测"
    prompts:
      - "取消我的会议提醒"
    watch:
      - "如果没有会议提醒，应该如实说没有"
      - "不要编造 job_id 或假装删掉了什么"
    after: "/new"

  - session: "S5 边界值 + 条件推理"
    prompts:
      - "30秒后提醒我一下"
      - "如果明天下雨就提醒我带伞，早上8点"
    watch:
      - "30 秒提醒能不能正常建出来"
      - "‘如果下雨’最好是延迟到明天再判断，不要现在就查天气"
    after: "/new"

  - session: "S6 隐性意图 + 全部取消"
    setup:
      - "每天早上9点提醒我喝水"
      - "每天下午2点提醒我喝水"
      - "2分钟后提醒我开会"
      - "3分钟后提醒我打电话"
    prompts:
      - "我已经喝过水了"
      - "先帮我看看有什么提醒，然后全部取消"
    watch:
      - "T1 只观察，不计分：看它会不会理解‘这个提醒不需要了’"
      - "T5 要先 list，再把用户任务都删掉，但不要误删 dream 系统任务"

quick_score:
  pass: "核心行为正确，工具和时间逻辑都对"
  partial: "方向对了，但策略一般，或参数不够理想"
  fail: "走错工具、时间逻辑错、编造结果、误删任务"
  invalid: "案例本身有歧义，不纳入通过率（当前主要是 T1）"

one_page_cheatsheet: |
  0. 准备：清 session → 重启 gateway → /new → hi

  1. S1
     - 五分钟之后叫我一声
     - 我的提醒设好了没？
     - 把刚才那个提醒改成10分钟后
     - /new

  2. S2
     - 帮我算一下 128×256 等于多少
     - /new

  3. S3
     - 帮我设一个昨天下午3点的提醒
     - /new

  4. S4
     - 取消我的会议提醒
     - /new

  5. S5
     - 30秒后提醒我一下
     - 如果明天下雨就提醒我带伞，早上8点
     - /new

  6. S6
     - [铺底] 每天早上9点提醒我喝水
     - [铺底] 每天下午2点提醒我喝水
     - [铺底] 2分钟后提醒我开会
     - [铺底] 3分钟后提醒我打电话
     - [观察] 我已经喝过水了
     - [计分] 先帮我看看有什么提醒，然后全部取消

  提醒：自然说就行，不用逐字照读。
